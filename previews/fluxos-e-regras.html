*{box-sizing:border-box}
body{margin:0;background:#d9d2bf;color:var(--tinta);font:16px/1.55 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

.stagewrap{display:flex;justify-content:center}
.stage{container-type:inline-size;width:100%;background:var(--solo);min-height:100vh}
body.mob .stagewrap{padding:20px 0 40px}

.main{padding:24px clamp(14px,4cqw,48px) 56px;max-width:1100px;margin:0 auto}
h1{font:700 clamp(28px,6cqw,42px)/1.1 var(--serif);margin:0 0 6px}
h2{font:700 24px/1.2 var(--serif);color:var(--folha);margin:0 0 4px;padding-top:8px;border-top:2px solid var(--folha)}
h3{font:700 18px/1.3 var(--serif);margin:0 0 8px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--barro);margin:0 0 8px}
.lead{color:var(--mut);margin:0 0 16px;max-width:68ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 24px;border-bottom:1px solid var(--linha);padding-bottom:10px}
.tabs button{min-height:44px;padding:0 14px;border:1px solid var(--linha);background:#fffc;border-radius:999px;font-weight:600;font-size:14px}
.tabs button[aria-selected=true]{background:var(--folha);color:#fff;border-color:var(--folha)}
section.sec{margin-bottom:36px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@container (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.box{background:#fffc;border:1px solid var(--linha);border-radius:8px;padding:14px;min-width:0}
.cap{font-size:13px;color:var(--mut);margin:6px 0 0}
.fl{display:block;width:100%;max-width:480px;height:auto;margin:0 auto}
.scroll{overflow-x:auto;border:1px dashed var(--linha);border-radius:6px;background:#fff8}
.hint{display:none;font-size:12px;color:var(--mut);margin:0 0 6px}
@container (max-width:830px){.hint{display:block}}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linha);vertical-align:top;overflow-wrap:anywhere}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
@container (max-width:640px){
  thead{display:none}
  tr{display:block;border:1px solid var(--linha);border-radius:8px;background:#fffc;margin:0 0 10px;padding:4px 0}
  td{display:block;border:0;padding:4px 12px}

}
ul.div{padding-left:20px;margin:0}ul.div li{margin:0 0 6px}

.n-dec{fill:#f3e6d3;stroke:var(--barro);stroke-width:1.4}
.n-end{fill:#e1ecd8;stroke:var(--folha);stroke-width:2}
.n-err{fill:#f6dcd6;stroke:var(--alta);stroke-width:1.2}
.n-warn{fill:#f3e6d3;stroke:var(--barro);stroke-width:1.2}
.n-ok{fill:#e1ecd8;stroke:var(--folha);stroke-width:1.2}
.ed{fill:none;stroke:var(--tinta);stroke-width:1.3}
.t{fill:var(--tinta);font-size:13px}
.sm{font-size:12px}
.lb{fill:var(--mut);font-size:10.5px;font-weight:700;paint-order:stroke;stroke:var(--solo);stroke-width:3px}
.sq-l{stroke:var(--mut);stroke-dasharray:4 4;stroke-width:1}

.sq-h{fill:var(--folha)}.sq-ht{fill:#fff;font-size:13px;font-weight:700}
.sep{fill:#f3e6d3;stroke:var(--barro)}

const NS='http://www.w3.org/2000/svg';
const FONT='13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const cv=document.createElement('canvas').getContext('2d');
function wrap(text,maxW,font){cv.font=font||FONT;const out=[];let cur='';for(const w of text.split(' ')){const t=cur?cur+' '+w:w;if(cv.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}if(cur)out.push(cur);return out}
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function defs(svg,id){const d=el('defs',{},svg);const m=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},d);el('path',{d:'M0,0 L10,5 L0,10 z',fill:'#1f2a1c'},m)}
function txt(g,lines,cx,top,h,cls,lh){const y0=top+h/2-(lines.length-1)*lh/2;lines.forEach((l,i)=>el('text',{x:cx,y:y0+i*lh,'text-anchor':'middle','dominant-baseline':'central',class:cls},g,l))}

function flow(f){
  const W=360,MW=178,EX=216,EW=144,TX=197,LH=16,PADV=14,GAP=22;
  const svg=el('svg',{viewBox:'0 0 '+W+' 100',class:'fl',role:'img','aria-label':f.title});
  const ID='ar'+(++window.__n||(window.__n=1));defs(svg,ID);
  const gE=el('g',{},svg),gN=el('g',{},svg);
  let y=2;
  f.steps.forEach((s,i)=>{
    const lines=wrap(s.text,MW-22),h=lines.length*LH+PADV;
    const ex=(s.exits||[]).map(e=>{const l=wrap(e.text,EW-14,'12px sans-serif');return{e,l,h:l.length*14+12}});
    const exH=ex.reduce((a,b)=>a+b.h+6,-6);
    const row=Math.max(h,exH);
    const cls=s.k==='dec'?'n-dec':s.k==='end'?'n-end':'n-box';
    if(s.k==='dec'){const k=12;el('polygon',{points:[[k,y],[MW-k,y],[MW,y+h/2],[MW-k,y+h],[k,y+h],[0,y+h/2]].map(p=>p.join(',')).join(' '),class:cls},gN)}
    else el('rect',{x:0,y,width:MW,height:h,rx:s.k==='end'?h/2>20?14:h/2:7,class:cls},gN);
    txt(gN,lines,MW/2,y,h,'t',LH);
    const ny=y+h/2;let ey=y;
    ex.forEach(o=>{
      const cy=ey+o.h/2;
      el('path',{d:'M'+MW+','+ny+' H'+TX+' V'+cy+' H'+EX,class:'ed','marker-end':'url(#'+ID+')'},gE);
      el('rect',{x:EX,y:ey,width:EW,height:o.h,rx:6,class:'n-'+o.e.k},gN);
      txt(gN,o.l,EX+EW/2,ey,o.h,"t sm",14);
      el('text',{x:TX+(EX-TX)/2,y:cy-5,'text-anchor':'middle',class:'lb'},gE,o.e.label);
      ey+=o.h+6;
    });
    if(i<f.steps.length-1)el('line',{x1:MW/2,y1:y+h,x2:MW/2,y2:y+row+GAP,class:'ed','marker-end':'url(#'+ID+')'},gE);
    y+=row+GAP;
  });
  svg.setAttribute('viewBox','0 0 '+W+' '+(y-GAP+4));
  return svg;
}

function seq(s){
  const CW=130,M=65,A=s.actors,idx=Object.fromEntries(A.map((a,i)=>[a,i]));
  const W=A.length*CW,X=a=>M+idx[a]*CW-M+CW/2;
  const svg=el('svg',{width:W,viewBox:'0 0 '+W+' 100',role:'img','aria-label':s.title,style:'display:block'});
  const SID='sa'+(++window.__n);defs(svg,SID);
  const gL=el('g',{},svg),gM=el('g',{},svg);
  A.forEach(a=>{el('rect',{x:X(a)-44,y:4,width:88,height:28,rx:6,class:'sq-h'},gM);el('text',{x:X(a),y:19,'text-anchor':'middle','dominant-baseline':'central',class:'sq-ht'},gM,a)});
  let y=52;
  for(const m of s.msgs){
    if(m[0]==='sep'){
      const ls=wrap(m[1],W-30,'11.5px sans-serif'),h=ls.length*14+10;
      el('rect',{x:6,y:y-4,width:W-12,height:h,rx:5,class:'sep'},gM);
      ls.forEach((l,i)=>el('text',{x:W/2,y:y-4+h/2+(i-(ls.length-1)/2)*14,'text-anchor':'middle','dominant-baseline':'central',class:'sq-t',style:'stroke:none'},gM,l));
      y+=h+12;continue;
    }
    const [a,b,t,dash]=m,x1=X(a),x2=X(b);
    if(a===b){
      const ls=wrap(t,170,'11.5px sans-serif');
      el('path',{d:`M${x1},${y} h30 v18 h-30`,class:'ed','marker-end':'url(#'+SID+')',fill:'none'},gM);
      ls.forEach((l,i)=>el('text',{x:x1+36,y:y+6+i*13,class:'sq-t'},gM,l));
      y+=Math.max(30,ls.length*13+14);continue;
    }
    const span=Math.abs(x2-x1),ls=wrap(t,Math.max(span-10,160),'11.5px sans-serif');
    ls.forEach((l,i)=>el('text',{x:(x1+x2)/2,y:y+i*13,'text-anchor':'middle',class:'sq-t'},gM,l));
    const ay=y+ls.length*13-4;
    el('line',{x1,y1:ay,x2,y2:ay,class:'ed','marker-end':'url(#'+SID+')',...(dash?{'stroke-dasharray':'5 4'}:{})},gM);
    y=ay+16;
  }
  A.forEach(a=>el('line',{x1:X(a),y1:32,x2:X(a),y2:y,class:'sq-l'},gL));
  svg.setAttribute('viewBox','0 0 '+W+' '+(y+4));svg.setAttribute('height',y+4);
  return svg;
}
